# Verify model mirrors; publication requires explicit opt-in.
name: Model mirror verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data_managers/**'
      - '.github/scripts/hf_mirror.py'
      - '.github/workflows/hf-mirror.yml'
      - 'tests/test_hf_mirror.py'
      - 'tests/fixtures/hf-mirror-smoke/**'
  # Pull requests verify mirrors in pr.yaml so failures reach the required gate.

permissions:
  contents: read

concurrency:
  group: model-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install publisher dependency
        run: python -m pip install huggingface_hub==1.31.0
      - name: Test publisher
        run: |
          python -m unittest discover -s tests -p 'test_hf_mirror.py' -v
      - name: Preview configured catalogues
        shell: bash
        run: python .github/scripts/hf_mirror.py --dry-run 2>&1 | tee hf-mirror-dry-run.log
      # Unset or false disables publishing; manual runs remain read-only. With no opted-in
      # release there is nothing to publish, so the step reports a notice and succeeds.
      - name: Publish verified releases and verify repeat is unchanged
        if: >-
          vars.ENABLE_HF_PUBLISHING == 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_GALAXY }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        shell: bash
        run: |
          expected=$(python -c "import runpy; print(len(runpy.run_path('.github/scripts/hf_mirror.py')['discover']('.')))")
          if [ "$expected" -eq 0 ]; then
            echo '::notice::No opted-in model releases found; nothing to publish.'
            exit 0
          fi
          for attempt in 1 2; do
            python .github/scripts/hf_mirror.py --publish 2>&1 | tee "hf-mirror-publish-${attempt}.log"
          done
          test "$(grep -Fc 'Existing release verified; no changes.' hf-mirror-publish-2.log)" -eq "$expected"
          if grep -Eq 'Verified and tagged commit|Updated model card on main' hf-mirror-publish-2.log; then
            echo 'Repeat publication unexpectedly changed a release or model card.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: model-mirror-verification
          path: hf-mirror-*.log
          if-no-files-found: ignore
