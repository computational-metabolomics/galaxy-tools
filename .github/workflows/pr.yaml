name: Galaxy Tool Linting and Tests for push and PR
on:
  # No path filter: the required check must always report, and changes under
  # .github/ (including the reference-data action) must be tested.
  pull_request:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'deprecated/**'
      - 'docs/**'
      - '.github/**'
      - '*'
env:
  GALAXY_FORK: galaxyproject
  GALAXY_BRANCH: release_26.1
  MAX_CHUNKS: 4
  MAX_FILE_SIZE: 1M
concurrency:
  # Cancel superseded PR runs; keep main/master runs separate to protect ToolShed uploads.
  group: pr-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.run_number || github.ref }}
  cancel-in-progress: true
jobs:
  mirror_verification:
    name: Verify model mirrors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check changed mirror paths
      id: changes
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/mirror-changed-files"
        required=false
        while IFS= read -r -d '' path; do
          case "$path" in
            data_managers/*|.github/scripts/hf_mirror.py|.github/workflows/hf-mirror.yml|.github/workflows/pr.yaml|tests/test_hf_mirror.py|tests/fixtures/hf-mirror-smoke/*)
              required=true
              break
              ;;
          esac
        done < "$RUNNER_TEMP/mirror-changed-files"
        echo "required=$required" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v7
      if: steps.changes.outputs.required == 'true'
      with:
        python-version: '3.12'
    - name: Install publisher dependency
      if: steps.changes.outputs.required == 'true'
      run: python -m pip install huggingface_hub==1.31.0
    - name: Preview configured catalogues
      if: steps.changes.outputs.required == 'true'
      shell: bash
      run: python .github/scripts/hf_mirror.py --dry-run 2>&1 | tee hf-mirror-dry-run.log
    - uses: actions/upload-artifact@v7
      if: always() && steps.changes.outputs.required == 'true'
      with:
        name: model-mirror-verification
        path: hf-mirror-*.log
        if-no-files-found: ignore

  # Share the Galaxy revision, changed repositories and chunks with downstream jobs.
  setup:
    name: Setup cache and determine changed repositories
    runs-on: ubuntu-latest
    outputs:
      galaxy-head-sha: ${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
      repository-list: ${{ steps.augment.outputs.repository-list }}
      test-repository-list: ${{ steps.augment.outputs.test-repository-list }}
      tool-list: ${{ steps.discover.outputs.tool-list }}
      chunk-count: ${{ steps.augment.outputs.chunk-count }}
      chunk-list: ${{ steps.augment.outputs.chunk-list }}
      commit-range: ${{ steps.discover.outputs.commit-range }}
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - name: Print github context properties
      run: |
        echo 'event: ${{ github.event_name }}'
        echo 'sha: ${{ github.sha }}'
        echo 'ref: ${{ github.ref }}'
        echo 'head_ref: ${{ github.head_ref }}'
        echo 'base_ref: ${{ github.base_ref }}'
        echo 'event.before: ${{ github.event.before }}'
        echo 'event.after: ${{ github.event.after }}'
    - name: Determine latest commit in the Galaxy repo
      id: get-galaxy-sha
      run: echo "galaxy-head-sha=$(git ls-remote https://github.com/${{ env.GALAXY_FORK }}/galaxy refs/heads/${{ env.GALAXY_BRANCH }} | cut -f1)" >> $GITHUB_OUTPUT
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v6
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
    - name: Cache .planemo
      uses: actions/cache@v6
      id: cache-planemo
      with:
        path: ~/.planemo
        key: planemo_cache_py_${{ matrix.python-version }}_gxy_${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
    # Cache wheels built from source distributions.
    - name: Install wheel
      run: pip install wheel
    - name: Install flake8
      run: pip install flake8 flake8-import-order
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Fake a Planemo run to update cache and determine commit range, repositories, and chunks
      uses: galaxyproject/planemo-ci-action@v1
      id: discover
      with:
        create-cache: ${{ steps.cache-pip.outputs.cache-hit != 'true' || steps.cache-planemo.outputs.cache-hit != 'true' }}
        galaxy-fork: ${{ env.GALAXY_FORK }}
        galaxy-branch: ${{ env.GALAXY_BRANCH }}
        max-chunks: ${{ env.MAX_CHUNKS }}
        python-version: ${{ matrix.python-version }}
    - name: Check reference-data CI configuration
      run: python -m unittest discover -s .github/actions/data-manager-tests/tests -v
    - name: Show commit range
      run: echo '${{ steps.discover.outputs.commit-range }}'
    - name: Include affected wrapper and data-manager pairs
      id: augment
      env:
        COMMIT_RANGE: ${{ steps.discover.outputs.commit-range }}
        DISCOVERED_REPOSITORIES: ${{ steps.discover.outputs.repository-list }}
      run: bash .github/actions/data-manager-tests/scripts/setup.sh
    - name: Show repository list
      run: echo '${{ steps.augment.outputs.repository-list }}'
    - name: Show tool list
      run: echo '${{ steps.discover.outputs.tool-list }}'
    - name: Show chunks
      run: |
        echo 'Using ${{ steps.augment.outputs.chunk-count }} chunks (${{ steps.augment.outputs.chunk-list }})'

  lint:
    name: Lint tool-list
    needs: setup
    if: ${{ needs.setup.outputs.repository-list != '' || needs.setup.outputs.tool-list != '' }}
    runs-on: ubuntu-latest
    # Label lookup needs pull-requests:read even with contents:read repository defaults.
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v6
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    # Fetch labels on every run so retries see label changes.
    # On push, use the commit's PR to preserve lint exemptions after merging.
    # Without an associated PR, run all checks.
    - name: Get PR labels
      id: pr-labels
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SHA: ${{ github.sha }}
      run: |
        # Assign first so a failing `gh api` fails the step: inside a command
        # substitution its exit status would be masked by `echo`, leaving an
        # empty output that silently reads as "no labels".
        if [ "$EVENT_NAME" = "pull_request" ]; then
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.labels[].name] | @json')
        else
          # A direct push with no associated PR yields [], i.e. full checks.
          labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[0].labels[]?.name] | @json')
        fi
        echo "json=$labels" >> "$GITHUB_OUTPUT"
    - name: Conditionally skip URL/version linter
      env:
        PR_LABELS: ${{ steps.pr-labels.outputs.json }}
      run: |
          set -x

          to_skip=()
          if echo "$PR_LABELS" | jq -e --arg s "skip-url-check" 'index($s)' > /dev/null; then
            to_skip+=("tool_urls")
          fi
          if echo "$PR_LABELS" | jq -e --arg s "skip-version-check" 'index($s)' > /dev/null; then
            to_skip+=("version_bumped")
          fi

          if [ ${#to_skip[@]} -gt 0 ]; then
            RESULT=$(IFS=,; echo "${to_skip[*]}")
            echo "EXTRA_SKIP=--skip $RESULT" >> "$GITHUB_ENV"
          else
            echo "EXTRA_SKIP=" >> "$GITHUB_ENV"
          fi
    - name: Planemo lint
      uses: galaxyproject/planemo-ci-action@v1
      id: lint
      with:
        mode: lint
        fail-level: warn
        repository-list: ${{ needs.setup.outputs.repository-list }}
        tool-list: ${{ needs.setup.outputs.tool-list }}
        additional-planemo-options: ${{ env.EXTRA_SKIP }}
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'Tool linting output'
        path: lint_report.txt

  flake8:
    name: Lint Python scripts
    needs: setup
    if: ${{ github.event_name == 'pull_request' && needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v6
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Install flake8
      run: pip install flake8 flake8-import-order
    - name: Flake8
      run: echo '${{ needs.setup.outputs.repository-list }}' | xargs -d '\n' flake8 --output-file pylint_report.txt --tee
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'Python linting output'
        path: pylint_report.txt

  lintr:
    name: Lint R scripts
    needs: setup
    if: ${{ needs.setup.outputs.repository-list != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        r-version: ['release']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
    - name: Cache R packages
      uses: actions/cache@v6
      with:
        path: ${{ env.R_LIBS_USER }}
        key: r_cache_${{ matrix.os }}_${{ matrix.r-version }}
    - name: Install packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::argparse 
          any::styler
    - name: lintr
      run: |
        set -eo pipefail
        echo '${{ needs.setup.outputs.repository-list }}' | xargs -d '\n' -n 1 ./.github/styler.R --dry off
        git status
        git diff --exit-code | tee rlint_report.txt
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'R linting output'
        path: rlint_report.txt

  file_sizes:
    name: Check file sizes
    needs: setup
    if: ${{ github.event_name == 'pull_request' && needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check file sizes
      run: |
        touch file_size_report.txt
        git diff --diff-filter=d --name-only ${{ needs.setup.outputs.commit-range }} > git.diff
        while read line; do
          find "$line" -type f -size +${{ env.MAX_FILE_SIZE }} >> file_size_report.txt
        done < git.diff
        if [[ -s file_size_report.txt ]]; then
          echo "Files larger than ${{ env.MAX_FILE_SIZE }} found"
          cat file_size_report.txt
          exit 1
        fi
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'File size report'
        path: file_size_report.txt

  test:
    name: Test tools
    needs: setup
    if: ${{ needs.setup.outputs.test-repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunk-list) }}
        python-version: ['3.11']
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v6
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Cache .planemo
      uses: actions/cache@v6
      id: cache-planemo
      with:
        path: ~/.planemo
        key: planemo_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores
    - name: Clean dotnet folder for space
      run: rm -Rf /usr/share/dotnet
    - name: Planemo test
      uses: ./.github/actions/data-manager-tests
      id: test
      with:
        repository-list: ${{ needs.setup.outputs.test-repository-list }}
        galaxy-fork: ${{ env.GALAXY_FORK }}
        galaxy-branch: ${{ env.GALAXY_BRANCH }}
        chunk: ${{ matrix.chunk }}
        chunk-count: ${{ needs.setup.outputs.chunk-count }}
        galaxy-slots: ${{ steps.cpu-cores.outputs.count }}
        # Limit each test to 15 minutes
        test_timeout: 900
    - uses: actions/upload-artifact@v7
      if: always()  # also keep reports from failed chunks
      with:
        name: 'Tool test output ${{ matrix.chunk }}'
        path: upload

  # Keep reports from failed chunks, then reject failed or missing results.
  combine_outputs:
    name: Combine chunked test results
    needs: [setup, test]
    if: ${{ always() && needs.setup.outputs.test-repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: 'Tool test output *'
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v6
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Combine outputs
      uses: galaxyproject/planemo-ci-action@v1
      id: combine
      with:
        mode: combine
        html-report: true
        markdown-report: true
    - uses: actions/upload-artifact@v7
      with:
        name: 'All tool test results'
        path: upload
    - run: cat upload/tool_test_output.md >> $GITHUB_STEP_SUMMARY
    - name: Check outputs
      uses: galaxyproject/planemo-ci-action@v1
      id: check
      with:
        mode: check
    - name: Check if all test chunks succeeded
      run: |
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          exit 1
        fi
        ls artifacts/
        NFILES=$(find artifacts/ -name "tool_test_output.json" | wc -l)
        if [[ "${{ needs.setup.outputs.chunk-count }}" != "$NFILES" ]]; then
          exit 1
        fi

  # Publish only when ENABLE_TOOLSHED_PUBLISHING is 'true'; keep IUC's Test/Main Tool Shed upload order.
  deploy:
    name: Deploy
    needs: [setup, lint, combine_outputs]
    if: >-
      vars.ENABLE_TOOLSHED_PUBLISHING == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v6
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Verify published reference data
      run: |
        python -m pip install huggingface_hub==1.31.0
        python .github/scripts/hf_mirror.py --verify-only
    - name: Deploy on testtoolshed
      uses: galaxyproject/planemo-ci-action@v1
      with:
        mode: deploy
        repository-list: ${{ needs.setup.outputs.repository-list }}
        shed-target: testtoolshed
        shed-key: ${{ secrets.TTS_API_KEY }}
      continue-on-error: true
    - name: Deploy on toolshed
      uses: galaxyproject/planemo-ci-action@v1
      with:
        mode: deploy
        repository-list: ${{ needs.setup.outputs.repository-list }}
        shed-target: toolshed
        shed-key: ${{ secrets.TS_API_KEY }}

  deploy-report:
    name: Report deploy status
    needs: [deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    # PR comments need both write scopes when secrets.PAT falls back to github.token.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    # Push events identify the PR through the commit; skip comments if none exists.
    - name: Get PR number
      id: getpr
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Assign first so a failing `gh api` fails the step rather than being
        # masked by `echo` inside a command substitution.
        number=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
        echo "number=$number" >> "$GITHUB_OUTPUT"
    - name: Create comment
      if: steps.getpr.outputs.number != ''
      uses: peter-evans/create-or-update-comment@v5
      with:
        # An explicitly empty token overrides the action's github.token default,
        # so fall back rather than passing secrets.PAT straight through.
        token: ${{ secrets.PAT || github.token }}
        issue-number: ${{ steps.getpr.outputs.number }}
        body: |
          Deployment status: **${{ needs.deploy.result }}**

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  determine-success:
    name: Check workflow success
    needs: [setup, lint, flake8, lintr, file_sizes, test, combine_outputs, mirror_verification]
    if: ${{ always() && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - name: Check setup and reference-data validation status
      if: ${{ needs.setup.result != 'success' }}
      run: exit 1
    - name: Check model mirror verification status
      if: ${{ needs.mirror_verification.result != 'success' }}
      run: exit 1
    - name: Check tool lint status
      if: ${{ needs.lint.result != 'success' && needs.lint.result != 'skipped' }}
      run: exit 1
    - name: Indicate Python script lint status
      if: ${{ needs.flake8.result != 'success' && needs.flake8.result != 'skipped' }}
      run: exit 1
    - name: Indicate R script lint status
      if: ${{ needs.lintr.result != 'success' && needs.lintr.result != 'skipped' }}
      run: exit 1
    - name: Indicate file size check status
      if: ${{ needs.file_sizes.result != 'success' && needs.file_sizes.result != 'skipped' }}
      run: exit 1
    - name: Check tool test status
      if: ${{ (needs.test.result != 'success' && needs.test.result != 'skipped') || (needs.combine_outputs.result != 'success' && needs.combine_outputs.result != 'skipped') }}
      run: exit 1
